<div class="hextra-carousel">
  <div class="viewport">
    <div class="track">
      {{ .Inner | markdownify }}
    </div>
  </div>

  <!-- Arrows -->
  <button class="nav prev" aria-label="Previous image">
    <svg viewBox="0 0 24 24">
      <path d="M15 18l-6-6 6-6" />
    </svg>
  </button>

  <button class="nav next" aria-label="Next image">
    <svg viewBox="0 0 24 24">
      <path d="M9 6l6 6-6 6" />
    </svg>
  </button>

  <!-- Dots -->
  <div class="dots"></div>
</div>

<style>
  .hextra-carousel {
    max-width: auto;
    margin: 2rem auto;
    position: relative;
  }

  /* viewport hides overflow */
  .hextra-carousel .viewport {
    overflow: hidden;
    border-radius: 16px;
    /* box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25); */
    background: #00000000;
  }

  /* track */
  .hextra-carousel .track {
    display: flex;
    cursor: grab;
    touch-action: pan-y;
    user-select: none;
  }

  .hextra-carousel .track:active {
    cursor: grabbing;
  }

  .hextra-carousel .track img {
    width: 100%;
    flex-shrink: 0;
    user-select: none;
    pointer-events: none;
    display: block;

    /* Modern cool transitions */
    transform: scale(0.95);
    filter: brightness(0.5) blur(2px);
    transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1),
      filter 0.8s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    opacity: 0.6;
  }

  .hextra-carousel .track img.active {
    transform: scale(1);
    filter: brightness(1) blur(0px);
    opacity: 1;
  }

  /* arrows */
  .hextra-carousel .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(15, 15, 15, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    /* opacity: 0; */
    opacity: 1;
    transition: opacity 0.3s ease, transform 0.3s ease, background-color 0.2s ease;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    z-index: 5;
  }



  .nav:hover {
    background: rgba(15, 15, 15, 0.5);
  }


  /* 
  .hextra-carousel:hover .nav {
    opacity: 1;
  } */

  .hextra-carousel .prev {
    left: 16px;
  }

  .hextra-carousel .next {
    right: 16px;
  }

  .hextra-carousel .nav:hover {
    background: rgba(0, 0, 0, 1);
    transform: translateY(-50%) scale(1.05);
  }

  .hextra-carousel .nav:active {
    transform: translateY(-50%) scale(0.95);
  }

  .hextra-carousel svg {
    width: 20px;
    height: 20px;
    stroke: #fff;
    stroke-width: 2.5;
    fill: none;
  }

  /* dots */
  .hextra-carousel .dots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }

  .hextra-carousel .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(150, 150, 150, 0.4);
    cursor: pointer;
    transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1),
      border-radius 0.3s cubic-bezier(0.22, 1, 0.36, 1),
      background-color 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .hextra-carousel .dot.active {
    background: #3b82f6;
    /* Blue active dot */
    width: 24px;
    border-radius: 12px;
  }

  @media (prefers-color-scheme: dark) {
    .hextra-carousel .dot.active {
      background: #60a5fa;
    }
  }
</style>

<script>
  function initCarousel(el) {
    const track = el.querySelector(".track");
    const originalImages = Array.from(track.querySelectorAll("img"));

    if (originalImages.length === 0) return;

    // Clean track: place images directly under it to avoid wrapping tag issues
    track.innerHTML = "";
    originalImages.forEach(img => track.appendChild(img));

    const images = Array.from(track.querySelectorAll("img"));
    const dotsWrap = el.querySelector(".dots");
    const prevBtn = el.querySelector(".prev");
    const nextBtn = el.querySelector(".next");

    if (images.length <= 1) {
      if (prevBtn) prevBtn.style.display = "none";
      if (nextBtn) nextBtn.style.display = "none";
      if (dotsWrap) dotsWrap.style.display = "none";
      if (images.length === 1) {
        images[0].classList.add("active");
      }
      return;
    }

    // Clone slides for infinite scrolling
    const firstClone = images[0].cloneNode(true);
    const lastClone = images[images.length - 1].cloneNode(true);
    firstClone.classList.add("clone");
    lastClone.classList.add("clone");

    track.appendChild(firstClone);
    track.insertBefore(lastClone, track.firstChild);

    // Initialize dots
    images.forEach((_, i) => {
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.addEventListener("click", () => {
        if (isTransitioning) return;
        go(i);
      });
      dotsWrap.appendChild(dot);
    });

    let index = 0; // index of active original image (0 to length-1)
    let isTransitioning = false;
    const AUTO_DELAY = 3000;
    let autoplayTimer = null;

    function update(animate = true) {
      if (animate) {
        track.style.transition = "transform 0.8s cubic-bezier(0.22, 1, 0.36, 1)";
      } else {
        track.style.transition = "none";
      }

      track.style.transform = `translateX(-${(index + 1) * 100}%)`;

      const activeDotIndex = (index + images.length) % images.length;

      // Highlight current image and its clones to prevent loop crossfade blinking
      const allItems = track.querySelectorAll("img");
      allItems.forEach((img, k) => {
        let imgOriginalIndex = k - 1;
        if (k === 0) {
          imgOriginalIndex = images.length - 1;
        } else if (k === images.length + 1) {
          imgOriginalIndex = 0;
        }
        img.classList.toggle("active", imgOriginalIndex === activeDotIndex);
      });

      // Update active dot indicator
      const dots = dotsWrap.querySelectorAll(".dot");
      dots.forEach((dot, i) => {
        dot.classList.toggle("active", i === activeDotIndex);
      });
    }

    function setTrackPositionWithoutAnimation() {
      track.style.transition = "none";
      track.style.transform = `translateX(-${(index + 1) * 100}%)`;

      const activeDotIndex = (index + images.length) % images.length;
      const allItems = track.querySelectorAll("img");
      allItems.forEach((img, k) => {
        let imgOriginalIndex = k - 1;
        if (k === 0) {
          imgOriginalIndex = images.length - 1;
        } else if (k === images.length + 1) {
          imgOriginalIndex = 0;
        }
        img.classList.toggle("active", imgOriginalIndex === activeDotIndex);
      });
    }

    function go(i) {
      if (isTransitioning) return;
      isTransitioning = true;
      index = i;
      update(true);
      restartAutoplay();
    }

    // Loop handling at transition boundaries
    track.addEventListener("transitionend", (e) => {
      if (e.target !== track) return;
      isTransitioning = false;

      if (index === -1) {
        index = images.length - 1;
        setTrackPositionWithoutAnimation();
      } else if (index === images.length) {
        index = 0;
        setTrackPositionWithoutAnimation();
      }
    });

    // Autoplay
    function startAutoplay() {
      stopAutoplay();
      autoplayTimer = setInterval(() => {
        if (!isDown && !isTransitioning) {
          go(index + 1);
        }
      }, AUTO_DELAY);
    }

    function stopAutoplay() {
      if (autoplayTimer) {
        clearInterval(autoplayTimer);
        autoplayTimer = null;
      }
    }

    function restartAutoplay() {
      stopAutoplay();
      startAutoplay();
    }

    // Hover pauses autoplay
    el.addEventListener("mouseenter", stopAutoplay);
    el.addEventListener("mouseleave", startAutoplay);

    // Navigation click listeners
    prevBtn.addEventListener("click", () => go(index - 1));
    nextBtn.addEventListener("click", () => go(index + 1));

    // Drag & Swipe handling
    let startX = 0;
    let isDown = false;
    let walk = 0;

    function handleDragStart(clientX) {
      if (isTransitioning) return;
      isDown = true;
      startX = clientX;
      walk = 0;
      stopAutoplay();
      track.style.transition = "none";
    }

    function handleDragMove(clientX) {
      if (!isDown) return;
      walk = clientX - startX;
      const baseTranslate = -(index + 1) * 100;
      const percentWalk = (walk / track.offsetWidth) * 100;
      track.style.transform = `translateX(${baseTranslate + percentWalk}%)`;
    }

    function handleDragEnd() {
      if (!isDown) return;
      isDown = false;

      const threshold = 50; // px minimum drag to register swipe
      if (walk < -threshold) {
        go(index + 1);
      } else if (walk > threshold) {
        go(index - 1);
      } else {
        go(index); // Snap back to current
      }
      startAutoplay();
    }

    // Mouse drag event bindings
    track.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      handleDragStart(e.clientX);
    });

    window.addEventListener("mousemove", (e) => {
      handleDragMove(e.clientX);
    });

    window.addEventListener("mouseup", handleDragEnd);

    // Touch swipe event bindings
    track.addEventListener("touchstart", (e) => {
      handleDragStart(e.touches[0].clientX);
    }, { passive: true });

    track.addEventListener("touchmove", (e) => {
      handleDragMove(e.touches[0].clientX);
    }, { passive: true });

    track.addEventListener("touchend", handleDragEnd);

    // Initialize
    update(false);
    startAutoplay();
  }

  document.querySelectorAll(".hextra-carousel").forEach(initCarousel);
</script>
