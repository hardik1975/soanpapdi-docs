# Hugo configuration file
# title: Soan Papdi FPGA

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Crowd Supply
      url: "https://www.crowdsupply.com/ashoktinkeringlabs/soan-papdi"
      weight: 1
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Downloads
      pageRef: /downloads
      weight: 2
    - name: About Us ↗
      url: "https://www.ashoktinkeringlabs.com/about"
      # pageRef: /about
      weight: 3
    # - name: Contact ↗
    #   url: "https://www.ashoktinkeringlabs.com/contact"
    #   weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: YouTube
      weight: 6
      url: "https://www.youtube.com/channel/UCSgtDb2ak5F8DXvanXzCepQ"
      params:
        icon: youtube
    - name: Twitter
      weight: 7
      url: "https://x.com/AshokTinkering"
      params:
        icon: x-twitter

params:
  theme:
    default: dark
    displayToggle: false
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: /images/soanpapdi.svg
      dark: /images/soanpapdi.svg
      link: /
      width: 120
      height: 10

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: false
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"
